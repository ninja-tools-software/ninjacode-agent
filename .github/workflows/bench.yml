name: NinjaBench

on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/bench/**"
      - ".github/workflows/bench.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  bench-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build deps
        run: pnpm --filter @ninjacode/bench... build

      - name: Run harness suite (deterministic mock scripts)
        run: pnpm bench:harness

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninjabench-harness-report
          path: runs/harness/

  bench-live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Require live key on scheduled runs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Scheduled live bench requires ANTHROPIC_API_KEY"
            exit 1
          fi
        if: github.event_name == 'schedule'
      - name: Live benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "workflow_dispatch live bench skipped — ANTHROPIC_API_KEY not configured"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm bench:confirm -- --provider anthropic
        id: live
      - name: Compare to last valid baseline
        if: steps.live.outputs.skipped != 'true' && env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -d runs/baseline ]; then
            node apps/bench/dist/index.js compare --current runs/confirm --baseline runs/baseline
          else
            echo "No baseline directory yet; publishing this run as the first comparable artifact"
          fi
