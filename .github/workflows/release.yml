name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:verify
      - run: pnpm check:build-purity
      - run: pnpm build
      - run: pnpm check:clean-tree
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm depcruise
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm check:clean-tree
      - run: pnpm bench:harness
      - run: pnpm check:clean-tree
      - name: Package VS Code extension
        run: pnpm --filter ninjacode package
      - name: Bundle CLI and ACP
        run: |
          pnpm --filter @ninjacode/cli bundle
          pnpm --filter @ninjacode/acp-agent bundle
      - run: pnpm check:clean-tree
      - name: Stage release assets
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p .release
          cp apps/vscode/*.vsix .release/
          cp apps/cli/dist/ninjacode.cjs ".release/ninjacode-cli-${VERSION}.cjs"
          cp apps/acp-agent/dist/ninjacode-acp.cjs ".release/ninjacode-acp-${VERSION}.cjs"
          ls -la .release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ninjacode-release
          path: .release/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/changelog-release-notes.mjs "$VERSION" release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" .release/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

  # Publishing requires secrets — configure VSCE_PAT, OVSX_PAT, NPM_TOKEN
  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:verify
      - run: pnpm build
      - run: pnpm check:clean-tree
      - name: Publish CLI + ACP (optional)
        run: |
          echo "Configure NPM_TOKEN to publish @ninjacode/cli and @ninjacode/acp-agent"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
