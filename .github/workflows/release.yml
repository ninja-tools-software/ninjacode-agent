name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:verify
      - run: pnpm check:build-purity
      - run: pnpm build
      - run: pnpm check:clean-tree
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm depcruise
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm check:clean-tree
      - run: pnpm bench:harness
      - run: pnpm check:clean-tree
      - name: Package VS Code extension
        run: pnpm --filter ninjacode package
      - run: pnpm check:clean-tree
      - name: Upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: ninjacode-vsix
          path: apps/vscode/*.vsix

  # Publishing requires secrets — configure VSCE_PAT, OVSX_PAT, NPM_TOKEN
  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:verify
      - run: pnpm build
      - run: pnpm check:clean-tree
      - name: Publish CLI + ACP (optional)
        run: |
          echo "Configure NPM_TOKEN to publish @ninjacode/cli and @ninjacode/acp-agent"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
