name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:build-purity
      - run: pnpm build
      - run: pnpm check:clean-tree
      - run: pnpm test
      - run: pnpm check:clean-tree
      - run: pnpm bench:harness
      - run: pnpm check:clean-tree
      - run: pnpm --filter @ninjacode/cli exec node dist/eval.js
      - run: pnpm typecheck

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Dependency boundaries and cycles
        run: pnpm depcruise
      - name: Dead code
        run: pnpm knip
